// 공유 도메인 모듈: 사용자 API(이 저장소 루트 프로젝트)와 호스트 관리자 앱(honeyRest_host)이 함께 쓰는
// JPA 엔티티, ReservationStatus, 배너 위치 등 순수 값 타입만 둔다.
// - Spring 서비스/리포지토리/설정은 두지 않는다 (Spring 의존성 없음).
// - Flyway 마이그레이션은 여기가 아니라 루트(사용자 API) 모듈의 src/main/resources/db/migration 에 있다.
// - 호스트는 composite build 로 좌표 com.honeyrest:honeyrest-domain 을 이 프로젝트로 치환해 사용한다.
plugins {
    id 'java-library'
}

group = 'com.honeyrest'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

repositories {
    mavenCentral()
}

// 버전은 두 앱이 쓰는 Spring Boot 3.5.4 가 관리하는 버전과 맞춘다 (Boot 를 올리면 여기도 함께 올린다).
// QueryDSL 은 두 앱과 같게 5.0.0 으로 고정한다 (Boot BOM 을 main 경로에 걸면 5.1.0 으로 올라가 버전이 갈린다).
dependencies {
    // 엔티티 매핑 어노테이션 (소비자 컴파일에도 필요하므로 api)
    api 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // @CreationTimestamp/@UpdateTimestamp(BaseEntity). 런타임 Hibernate 는 각 앱의 spring-boot-starter-data-jpa 가 제공한다.
    compileOnly 'org.hibernate.orm:hibernate-core:6.6.22.Final'

    // QueryDSL Q 타입(QReservation 등)을 엔티티와 같은 패키지로 생성한다 (사용자 API 의 QueryDSL 리포지토리가 사용).
    // querydsl-core 는 Q 타입 컴파일에만 필요하다. Q 타입을 쓰는 앱은 querydsl-jpa(→ querydsl-core)를 직접 의존한다.
    compileOnly 'com.querydsl:querydsl-core:5.0.0'

    compileOnly 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'org.projectlombok:lombok:1.18.38'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api:2.1.1'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0'

    // 테스트: 엔티티 도메인 메서드/상태 상수 단위 테스트 (DB·Spring 없음)
    testImplementation platform('org.springframework.boot:spring-boot-dependencies:3.5.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.assertj:assertj-core'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testCompileOnly 'org.projectlombok:lombok:1.18.38'
    testAnnotationProcessor 'org.projectlombok:lombok:1.18.38'
}

tasks.named('test') {
    useJUnitPlatform()
}
