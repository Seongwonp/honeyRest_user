# =============================================================================
# Render Blueprint — HoneyRest 보여주기용 데모 (무료 플랜, 외부 DB/Redis 없음)
#   Render 대시보드 → New → Blueprint → 이 저장소(honeyRest_user) 선택 → Apply
#   절차·주의사항: docs/DEPLOY_RENDER.md
#
#   honeyrest       : 사용자 사이트. React SPA + 사용자 API 를 한 컨테이너·같은 Origin 에서 서빙 (Dockerfile.render)
#   honeyrest-admin : 관리자 사이트 (honeyRest_host 저장소의 Dockerfile.render)
#
# 두 서비스는 각자 H2 인메모리 DB 를 쓴다 → 서로 데이터가 공유되지 않고, 재시작(15분 무접속 후 잠듦)하면 시드 상태로 돌아간다.
# 서비스 이름이 이미 쓰이고 있으면 Render 가 주소에 접미사를 붙인다(예: honeyrest-abcd.onrender.com).
#   그때는 아래 APP_BASE_URL / VITE_ADMIN_URL 값을 실제 주소로 바꾸고 다시 배포한다 (docs/DEPLOY_RENDER.md "주소가 다를 때").
# 아래 데모 계정 비밀번호는 공개 데모용으로 문서에 공개한 값이다 (실제 서비스 비밀번호로 쓰지 말 것).
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 사용자 사이트 + 사용자 API (https://honeyrest.onrender.com)
  # ---------------------------------------------------------------------------
  - type: web
    name: honeyrest
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Seongwonp/honeyRest_user
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      # JWT 서명 키: Render 가 무작위 값을 만들어 넣는다 (재배포해도 유지)
      - key: JWT_SECRET
        generateValue: true
      # Render 는 HTTPS 이므로 리프레시 토큰 쿠키에 Secure 를 붙인다
      - key: COOKIE_SECURE
        value: "true"
      # 공개 주소 (메일 링크·OAuth 기준값. 이름에 접미사가 붙으면 실제 주소로 바꿀 것)
      - key: APP_BASE_URL
        value: https://honeyrest.onrender.com
      # ---- 빌드 인자 (Dockerfile.render 의 ARG 와 같은 이름) ----
      # 데모 배너의 "관리자 데모 열기" 링크. SPA 번들에 상수로 들어가므로 바꾸면 재배포(빌드)가 필요하다.
      - key: VITE_ADMIN_URL
        value: https://honeyrest-admin.onrender.com
      # 프론트엔드(honeyrest_user_react) 브랜치/태그
      - key: FRONTEND_REF
        value: master
      # ---- JVM: 512MB / 0.1 CPU 용 ----
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
      - key: TZ
        value: Asia/Seoul

  # ---------------------------------------------------------------------------
  # 관리자 사이트 (https://honeyrest-admin.onrender.com)
  # ---------------------------------------------------------------------------
  - type: web
    name: honeyrest-admin
    runtime: docker
    plan: free
    region: singapore
    repo: https://github.com/Seongwonp/honeyRest_host
    branch: main
    dockerfilePath: ./Dockerfile.render
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: demo
      - key: JWT_SECRET
        generateValue: true
      # 데모 계정 비밀번호 (DataInitializer 가 이 값으로 계정을 만들고, 로그인 화면에도 그대로 안내한다)
      #   업체 관리자 contact@honeyrest.com / 최고 관리자 admin@honeyrest.com
      - key: DEMO_COMPANY_PASSWORD
        value: Demo1234!
      - key: DEMO_ADMIN_PASSWORD
        value: Demo1234!
      # 서브모듈(libs/honeyrest-user)이 비어 있을 때 clone 할 honeyRest_user 브랜치/태그 (빌드 인자)
      - key: USER_REF
        value: main
      - key: JAVA_TOOL_OPTIONS
        value: -XX:MaxRAMPercentage=50 -XX:+UseSerialGC -Xss512k -XX:MaxMetaspaceSize=160m -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError
      - key: TZ
        value: Asia/Seoul
