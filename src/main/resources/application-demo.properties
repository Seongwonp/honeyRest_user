# =============================================================================
# demo 프로필 — Render 무료 플랜 "보여주기용" 데모 (Dockerfile.render, render.yaml)
# 실행: SPRING_PROFILES_ACTIVE=demo java -jar app.jar     (로컬: ./gradlew bootRun --args='--spring.profiles.active=demo')
#
# 하나의 컨테이너가 React SPA(정적 파일)와 사용자 API 를 같은 Origin 에서 함께 서빙한다 → CORS 없음, 리프레시 쿠키 그대로 동작.
# 외부 서비스(MySQL, Redis, SMTP, 토스페이먼츠, Firebase, application_security.properties) 없이 기동한다.
#   - DB      : H2 인메모리(MySQL 모드). 기동할 때마다 db/demo-seed.sql 로 새로 채운다 → 재시작하면 모든 변경이 사라진다.
#   - Redis   : 자동 설정 제외 + 인메모리 RedisTemplate (e2e.E2eRedisConfig, e2e|demo 공용)
#   - 메일    : 발송하지 않음 (e2e.E2eNoOpEmailService, e2e|demo 공용) → 신규 가입의 이메일 인증은 끝낼 수 없다(데모 계정 사용)
#   - 결제    : 항상 승인하는 토스 스텁 (e2e.E2eTossClient, e2e|demo 공용). 실제 청구 없음.
#   - 날씨    : WEATHER_API_KEY 가 없으면 예시 날씨 (service.weather.DemoWeatherClient, 응답 sample=true)
#   - /e2e/** 테스트 보조 엔드포인트는 e2e 프로필 전용이라 여기에는 없다.
#   - SPA 폴백: demo.DemoSpaFallbackController (확장자 없는 GET → /index.html)
# 이 파일의 비밀값 기본값은 모두 데모용 더미다. 운영 데이터/운영 비밀값과 절대 함께 쓰지 말 것.
# =============================================================================

# Render 는 PORT 환경변수로 수신 포트를 알려 준다 (로컬 기본 8080)
server.port=${PORT:8080}
# Render 프록시가 TLS 를 끝내고 X-Forwarded-Proto/Host 를 붙인다. 프록시 IP 대역을 알 수 없으므로 framework 전략으로 신뢰한다.
server.forward-headers-strategy=framework
# 0.1 CPU / 512MB: 요청 스레드를 줄여 스택 메모리를 아낀다 (보여주기용 동시 접속 수준이면 충분)
server.tomcat.threads.max=${TOMCAT_MAX_THREADS:20}
server.tomcat.threads.min-spare=2

# 공개 주소 (메일 링크·OAuth 기준). 같은 Origin 이라 CORS 는 사실상 쓰이지 않는다.
app.base-url=${APP_BASE_URL:http://localhost:8080}
app.cors.allowed-origins=${APP_CORS_ORIGINS:${app.base-url}}

# ---- SPA 정적 파일 ----
# Dockerfile.render 가 SPA 빌드(dist/)를 /app/static 에 복사한다. 로컬 실행 시 APP_STATIC_DIR 로 dist 경로를 줄 수 있다.
spring.web.resources.static-locations=file:${APP_STATIC_DIR:/app/static}/,classpath:/static/
# WebConfig 의 정규식 view controller 포워딩은 /assets/*.js 까지 index.html 로 보내므로 끄고 DemoSpaFallbackController 를 쓴다
app.web.legacy-spa-forward.enabled=false

# ---- DB: H2 인메모리 (MySQL 호환 모드) ----
# H2 드라이버: bootRun 은 developmentOnly, Dockerfile.render 는 ./gradlew bootJar -Pdemo 로 실행 jar 에 넣는다 (운영 jar 에는 없음).
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:honeyrest_demo;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE,YEAR,MONTH,DAY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=4
# Flyway V10 은 MySQL 전용 구문이라 H2 에서 실행할 수 없다 → JPA 엔티티로 스키마 생성 (e2e 와 같은 방식)
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- 시드 데이터 ----
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/demo-seed.sql
spring.sql.init.encoding=UTF-8

# ---- 캐시/Redis: 사용하지 않음 ----
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=simple

# ---- 헬스 체크 (render.yaml healthCheckPath: /actuator/health) ----
# DB 핑만 하는 가벼운 체크. 외부 연동(Redis/메일) 상태에 묶이지 않게 한다.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.mail.enabled=false
management.health.diskspace.enabled=false

# ---- 파일 저장소: 로컬 디스크 (이미지에 /app/uploads/placeholder 포함, 업로드 파일은 재시작 시 사라짐) ----
app.storage.type=local
app.storage.local.dir=${APP_STORAGE_LOCAL_DIR:./uploads}

# ---- 메일: 발송하지 않음 (E2eNoOpEmailService) ----
spring.mail.host=localhost
spring.mail.port=2525
app.email.rate-limit.max-requests=20

# ---- 비밀값 (데모용) ----
# JWT_SECRET 은 render.yaml 에서 generateValue 로 만든다. 로컬 실행용 기본값은 더미(>= 32바이트).
jwt.secret-key-value=${JWT_SECRET:demo-only-jwt-secret-key-must-be-at-least-32-bytes-long}
com.tjfgusdh.toss.widgetClientKey=demo_ck_not_used
com.tjfgusdh.toss.widgetSecretKey=demo_sk_not_used
# 날씨: 키가 없으면 demo 전용 DemoWeatherClient 가 예시 날씨를 돌려준다 (키가 있으면 실제 OpenWeather 값)
weather.api.key=${WEATHER_API_KEY:}
fire.base.secretKey=not-configured
google.client-id=not-configured
google.client-secret=not-configured
kakao.client-id=not-configured
kakao.client-secret=not-configured
kakao.redirect-uri=${app.base-url}/login/kakao/callback
gmail.username=demo@example.com
gmail.access-token=not-configured

# ---- 리프레시 토큰 쿠키 ----
# Render 는 HTTPS 이므로 render.yaml 에서 COOKIE_SECURE=true. 로컬 http 확인용 기본값은 false.
security.cookie.refresh.secure=${COOKIE_SECURE:false}
security.cookie.refresh.same-site=Strict

# ---- Swagger: 데모에서는 공개 (API 구경용) ----
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

# ---- 기타 ----
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
logging.level.root=INFO
logging.level.com.honeyrest=INFO
logging.level.org.hibernate.SQL=WARN
