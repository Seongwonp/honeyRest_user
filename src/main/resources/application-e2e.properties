# e2e 프로필 전용 설정 (프론트엔드 Playwright 사용자 여정 테스트용 백엔드).
# 실행: ./gradlew bootRun --args='--spring.profiles.active=e2e'
#
# 외부 서비스(MySQL, Redis, Firebase, Gmail SMTP, 토스페이먼츠, application_security.properties) 없이 기동한다.
# test 프로필(src/test/resources/application-test.properties)과 같은 원칙이며 차이는 아래와 같다.
#   - 기동할 때마다 H2 인메모리 DB 를 새로 만들고 db/e2e-seed.sql 시드를 넣는다 (종료 시 폐기).
#   - Redis 자동 설정을 끄고 인메모리 RedisTemplate(e2e.E2eRedisConfig)을 쓴다.
#   - 메일은 보내지 않고(e2e.E2eNoOpEmailService), 토스는 항상 승인하는 스텁(e2e.E2eTossClient)이다.
#   - /e2e/** 테스트 보조 엔드포인트(e2e.E2eSupportController)가 이 프로필에서만 생긴다.
# 절대 운영 DB/운영 비밀값과 함께 쓰지 말 것. 이 파일의 비밀값은 모두 동작하지 않는 더미다.

server.port=${E2E_API_PORT:8080}
app.base-url=${E2E_WEB_BASE_URL:http://localhost:5173}

# ---- DB: H2 인메모리 (MySQL 호환 모드) ----
# H2 드라이버는 build.gradle 에서 developmentOnly(bootRun 전용, bootJar 미포함) + testRuntimeOnly 로 들어온다.
# Flyway V10 은 MySQL 전용 구문을 써서 H2 에서 실행할 수 없으므로 Flyway 를 끄고 JPA 엔티티로 스키마를 만든다.
spring.datasource.driver-class-name=org.h2.Driver
# NON_KEYWORDS: user 등 H2 예약어를 테이블/컬럼명으로 쓰는 엔티티가 있어 식별자로 허용한다.
spring.datasource.url=jdbc:h2:mem:honeyrest_e2e;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE,YEAR,MONTH,DAY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# ---- 시드 데이터 ----
# Hibernate 가 스키마를 만든 뒤(defer) db/e2e-seed.sql 을 실행한다.
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
spring.sql.init.data-locations=classpath:db/e2e-seed.sql
spring.sql.init.encoding=UTF-8

# ---- 캐시/Redis ----
# Redis 자동 설정을 제외해 연결 시도 자체가 없게 하고, RedisTemplate 은 인메모리 구현으로 대체한다.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
spring.cache.type=simple
management.health.redis.enabled=false
management.health.mail.enabled=false

# ---- 파일 저장소: 로컬 (FirebaseConfig/FirebaseFileStorage 비활성) ----
app.storage.type=local
app.storage.local.dir=${java.io.tmpdir}/honeyrest-e2e-uploads

# ---- 메일: 발송하지 않음 ----
# JavaMailSender 빈은 만들어지지만 E2eNoOpEmailService 가 발송을 전부 생략하므로 SMTP 연결을 하지 않는다.
spring.mail.host=localhost
spring.mail.port=2525
# 같은 이메일로 여러 번 가입/재발송하는 테스트 재실행을 막지 않도록 한도를 넉넉히 둔다.
app.email.rate-limit.max-requests=1000

# ---- 비밀값 더미 (application_security.properties 대체) ----
# jwt.secret-key 는 HS256 요구사항(>= 32바이트)을 만족해야 한다.
jwt.secret-key-value=e2e-only-jwt-secret-key-must-be-at-least-32-bytes-long
com.tjfgusdh.toss.widgetClientKey=test_ck_e2e_dummy
com.tjfgusdh.toss.widgetSecretKey=test_sk_e2e_dummy
weather.api.key=e2e-weather-key
fire.base.secretKey=e2e-firebase-key.json
google.client-id=e2e-google-client-id
google.client-secret=e2e-google-client-secret
kakao.client-id=e2e-kakao-client-id
kakao.client-secret=e2e-kakao-client-secret
gmail.username=e2e@example.com
gmail.access-token=e2e-gmail-app-password

# ---- 기타 ----
# bootRun 에 포함되는 devtools 의 자동 재시작이 테스트 도중 서버를 재기동하지 않게 한다.
spring.devtools.restart.enabled=false
spring.devtools.livereload.enabled=false
spring.jpa.show-sql=false
logging.level.com.honeyrest=INFO
