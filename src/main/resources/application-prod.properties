# =============================================================================
# 운영(prod) 프로필 — 단일 서버 Docker 배포용 (deploy/docker-compose.yml 의 user-api 서비스)
# 실행: SPRING_PROFILES_ACTIVE=prod java -jar app.jar
#
# 원칙
#   - 비밀값·접속 정보는 전부 환경변수로 받는다. 이 파일에는 비밀값이 없으므로 커밋해도 된다.
#   - 필수(없으면 기동 실패가 맞는 값): DB_URL, DB_USERNAME, DB_PASSWORD, JWT_SECRET, APP_BASE_URL
#   - 선택(비어 있어도 기동은 성공, 해당 기능만 동작하지 않음):
#       MAIL_*            → 비어 있으면 메일 발송 no-op (service/email/NoOpEmailService)
#       TOSS_*            → 결제 승인 호출이 토스에서 거절되어 결제만 실패
#       GOOGLE_*/KAKAO_*  → 소셜 로그인만 실패 (Spring OAuth2 등록이 빈 client-id 로 기동 실패하지 않도록 기본값을 둔다)
#       WEATHER_API_KEY   → 날씨 위젯만 실패
#   - application_security.properties 는 이미지에 포함하지 않는다(.dockerignore). 기본 설정의 optional import 는 무시된다.
# =============================================================================

server.port=${SERVER_PORT:8080}
# Caddy(리버스 프록시)가 보내는 X-Forwarded-Proto/Host/For 를 신뢰한다 → request.getScheme() == https,
# OAuth {baseUrl}, 리다이렉트 주소가 공개 주소 기준으로 만들어진다. (Tomcat RemoteIpValve, 사설 대역 프록시만 신뢰)
server.forward-headers-strategy=native
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 프론트엔드(SPA) 공개 주소. 메일 링크, 구글 OAuth redirect_uri, 카카오 redirect_uri 의 기준이 된다.
app.base-url=${APP_BASE_URL}
# CORS 허용 Origin (쉼표 구분). 같은 Origin 배포라 실제로는 쓰이지 않지만 기본값은 공개 주소로 둔다.
app.cors.allowed-origins=${APP_CORS_ORIGINS:${app.base-url}}

# ---- DB (MySQL 8.0) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
# 1 OCPU 서버 기준으로 풀을 작게 둔다 (호스트 앱과 MySQL max_connections 를 나눠 쓴다)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:8}
spring.datasource.hikari.minimum-idle=2

# ---- 스키마: Flyway 가 소유 (V1~), JPA 는 검증만 ----
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- Redis (캐시, 토큰/발송 한도 등) ----
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.connect-timeout=2s
spring.data.redis.timeout=3s

# ---- 파일 저장소: 로컬 디스크 (Docker 볼륨 uploads, 호스트 앱과 공유) ----
app.storage.type=local
app.storage.local.dir=${APP_STORAGE_LOCAL_DIR:/app/uploads}

# ---- 비밀값 (환경변수) ----
# HS256 키: 32바이트 이상 필요 (setup.sh 가 openssl rand 로 생성)
jwt.secret-key-value=${JWT_SECRET}
com.tjfgusdh.toss.widgetClientKey=${TOSS_CLIENT_KEY:}
com.tjfgusdh.toss.widgetSecretKey=${TOSS_SECRET_KEY:}
weather.api.key=${WEATHER_API_KEY:}
# app.storage.type=firebase 일 때만 쓰인다 (운영 배포는 local)
fire.base.secretKey=${FIREBASE_SECRET_KEY:not-configured}

# ---- 소셜 로그인 (선택) ----
# 빈 문자열이면 Spring OAuth2 Client 가 "Client id must not be empty" 로 기동에 실패하므로
# 미설정 시 not-configured 라는 더미 값을 둔다 (docker-compose 에서도 같은 기본값을 넣는다).
google.client-id=${GOOGLE_CLIENT_ID:not-configured}
google.client-secret=${GOOGLE_CLIENT_SECRET:not-configured}
kakao.client-id=${KAKAO_CLIENT_ID:not-configured}
kakao.client-secret=${KAKAO_CLIENT_SECRET:not-configured}
# SPA 의 카카오 콜백 경로와 같아야 한다 (카카오 개발자 콘솔의 Redirect URI 에도 등록)
kakao.redirect-uri=${KAKAO_REDIRECT_URI:${app.base-url}/login/kakao/callback}

# ---- 메일 (선택, Gmail SMTP + 앱 비밀번호) ----
# MAIL_USERNAME 이 비어 있으면 MailEnabledCondition 이 no-op 발송기를 등록한다. 강제로 끄려면 MAIL_ENABLED=false.
gmail.username=${MAIL_USERNAME:}
gmail.access-token=${MAIL_PASSWORD:}
app.mail.enabled=${MAIL_ENABLED:}
# 헬스 체크가 외부 SMTP 상태에 묶이지 않게 한다 (메일 장애로 컨테이너가 unhealthy 가 되면 안 됨)
management.health.mail.enabled=false

# ---- 리프레시 토큰 쿠키 ----
# HTTPS(Caddy) 뒤에서만 운영하므로 Secure. SPA 와 API 가 같은 Origin 이라 SameSite=Strict 를 유지한다.
security.cookie.refresh.secure=true
security.cookie.refresh.same-site=Strict

# ---- Swagger: 운영에서는 기본 비활성 (SPRINGDOC_ENABLED=true 로 켤 수 있음) ----
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

# ---- 헬스 체크 (docker-compose healthcheck: GET /actuator/health) ----
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# ---- 로그 ----
logging.level.root=INFO
logging.level.com.honeyrest=INFO
logging.level.org.hibernate.SQL=WARN
