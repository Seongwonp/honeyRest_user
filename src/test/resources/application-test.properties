# test 프로필 전용 설정.
# honeyrest_db(개발용 실 DB)와 분리된 스키마를 사용해 테스트가 실제 사용자/결제 데이터를 건드리지 않도록 한다.
# 비밀번호는 기존 application_security.properties를 그대로 재사용한다(로컬 MySQL root 계정 공용).
spring.config.import=classpath:application_security.properties

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/honeyrest_user_test?serverTimezone=Asia/Seoul&characterEncoding=UTF-8&createDatabaseIfNotExist=true
spring.datasource.username=root

spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
