# test 프로필 전용 설정.
# 외부 서비스(MySQL, Redis, application_security.properties, Firebase) 없이 ./gradlew test 가 통과하도록 자급자족 구성한다.
# 로컬/CI 어디서든 동일하게 동작하며 개발용 실 DB(honeyrest_db)를 절대 건드리지 않는다.

# ---- DB: H2 인메모리 (MySQL 호환 모드) ----
# Flyway V10 은 MySQL 전용 PREPARE/information_schema 구문을 쓰므로 H2 에서 실행할 수 없다.
# 따라서 테스트에서는 Flyway 를 끄고 JPA 엔티티로 스키마를 생성한다(create-drop).
# => 마이그레이션 SQL 자체의 정합성은 이 테스트로 검증되지 않는다(docs/IMPROVEMENTS.md 참고).
spring.datasource.driver-class-name=org.h2.Driver
# NON_KEYWORDS: user 등 H2 예약어를 테이블/컬럼명으로 쓰는 엔티티가 있어 식별자로 허용한다.
spring.datasource.url=jdbc:h2:mem:honeyrest;MODE=MySQL;DATABASE_TO_LOWER=TRUE;CASE_INSENSITIVE_IDENTIFIERS=TRUE;NON_KEYWORDS=USER,VALUE,YEAR,MONTH,DAY;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.minimum-idle=1
spring.datasource.hikari.maximum-pool-size=5
spring.flyway.enabled=false
spring.jpa.hibernate.ddl-auto=create-drop

# ---- 캐시/Redis ----
# @Cacheable 은 인메모리 캐시로 대체. RedisTemplate 빈은 생성되지만 Lettuce 는 지연 연결이므로
# 실제 Redis 명령을 호출하지 않는 한 기동에 Redis 서버가 필요 없다.
spring.cache.type=simple
management.health.redis.enabled=false

# ---- 파일 저장소: 로컬 (FirebaseConfig/FirebaseFileStorage 비활성) ----
app.storage.type=local
app.storage.local.dir=${java.io.tmpdir}/honeyrest-test-uploads

# ---- 비밀값 더미 (application_security.properties 대체) ----
# jwt.secret-key 는 HS256 요구사항(>= 32바이트)을 만족해야 한다.
jwt.secret-key-value=test-only-jwt-secret-key-must-be-at-least-32-bytes-long
com.tjfgusdh.toss.widgetClientKey=test_ck_dummy
com.tjfgusdh.toss.widgetSecretKey=test_sk_dummy
weather.api.key=test-weather-key
fire.base.secretKey=test-firebase-key.json
google.client-id=test-google-client-id
google.client-secret=test-google-client-secret
kakao.client-id=test-kakao-client-id
kakao.client-secret=test-kakao-client-secret
gmail.username=test@example.com
gmail.access-token=test-gmail-app-password
