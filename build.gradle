plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.honeyRest'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // Remove default logging (Logback) to avoid conflict with Log4j2
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 공유 도메인 모듈 (JPA 엔티티, ReservationStatus 등 — com.honeyrest.domain.*). 호스트 관리자 앱과 같은 소스를 쓴다.
    implementation project(':honeyrest-domain')

    // 웹 기능 (컨트롤러, REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 보안 및 인증 (OAuth2, JWT)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JWT 토큰 처리
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 데이터베이스 (JPA, MySQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // JPA QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 개발 편의 기능 (자동 리시빙, 핫 리로드)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // 이메일 발송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 유효성 검사
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 객체 매핑
    implementation 'org.modelmapper:modelmapper:3.2.0'

    // 로그 처리 (Log4j2)
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // 파일 업로드 및 이미지 처리
    // Firebase Storage는 app.storage.type=firebase 일 때만 사용 (기본값 local은 로컬 디스크 저장)
    implementation("com.google.firebase:firebase-admin:9.2.0")
    implementation 'net.coobird:thumbnailator:0.4.19'


    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 롬복
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 관련
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트 전용 인메모리 DB (MySQL 호환 모드) - 외부 MySQL 없이 @SpringBootTest 실행
    testRuntimeOnly 'com.h2database:h2'
    // e2e 프로필(bootRun --spring.profiles.active=e2e)도 H2 로 기동한다.
    // developmentOnly 는 bootRun 클래스패스에만 들어가고 bootJar(운영 산출물)에는 포함되지 않는다.
    developmentOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'
    // 스키마 통합 테스트 (integrationTest 태스크 전용): Docker 로 실제 MySQL 8.0 을 띄워
    // Flyway V1~최신 적용 + Hibernate ddl-auto=validate 를 검증한다. 버전은 Spring Boot BOM 이 관리한다.
    testImplementation 'org.testcontainers:junit-jupiter'
    testImplementation 'org.testcontainers:mysql'


    // 캐싱 기능 (Spring Cache)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Redis 연동 (세션, 캐싱, 실시간 처리)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 서버 모니터링 및 헬스 체크
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 외부 API 재시도 처리
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // DB 마이그레이션 관리
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'


}

def querydslDir = file("$buildDir/generated/sources/annotationProcessor/java/main")

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}


// 기본 test: H2(test 프로필) 기반의 빠른 테스트만 실행한다. Docker 가 필요한 integration 태그는 제외.
tasks.named('test') {
    useJUnitPlatform {
        excludeTags 'integration'
    }
}

// integrationTest: @Tag("integration") 테스트만 실행한다 (Testcontainers MySQL 8.0).
// - Docker 가 없으면 해당 테스트는 실패가 아니라 건너뛴다(skip).
// - CI 처럼 반드시 실행돼야 하는 환경에서는 INTEGRATION_REQUIRE_DOCKER=true 로 두면
//   Docker 부재 시 DockerAvailabilityGuardTest 가 실패해 '조용히 전부 skip 된 초록불'을 막는다.
// 실행: ./gradlew test integrationTest
tasks.register('integrationTest', Test) {
    description = 'Testcontainers(MySQL 8.0) 로 Flyway 마이그레이션과 엔티티 스키마 검증을 실행한다.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'integration'
    }
    systemProperty 'integration.requireDocker',
            providers.environmentVariable('INTEGRATION_REQUIRE_DOCKER').getOrElse('false')
    shouldRunAfter tasks.named('test')
}