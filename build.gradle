plugins {
    id 'java'
    id 'org.springframework.boot' version '3.5.4'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.honeyRest'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
    // Remove default logging (Logback) to avoid conflict with Log4j2
    all {
        exclude group: 'org.springframework.boot', module: 'spring-boot-starter-logging'
    }
}

repositories {
    mavenCentral()
}

dependencies {
    // 웹 기능 (컨트롤러, REST API)
    implementation 'org.springframework.boot:spring-boot-starter-web'

    // 보안 및 인증 (OAuth2, JWT)
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JWT 토큰 처리
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // 데이터베이스 (JPA, MySQL)
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    // JPA QueryDSL
    implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta'
    annotationProcessor 'com.querydsl:querydsl-apt:5.0.0:jakarta'
    annotationProcessor 'jakarta.annotation:jakarta.annotation-api'
    annotationProcessor 'jakarta.persistence:jakarta.persistence-api'

    // 개발 편의 기능 (자동 리시빙, 핫 리로드)
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    // API 문서화 (Swagger UI)
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.2.0'

    // 이메일 발송
    implementation 'org.springframework.boot:spring-boot-starter-mail'

    // 유효성 검사
    implementation 'org.springframework.boot:spring-boot-starter-validation'

    // 객체 매핑
    implementation 'org.modelmapper:modelmapper:3.2.0'

    // 로그 처리 (Log4j2)
    implementation 'org.springframework.boot:spring-boot-starter-log4j2'

    // 파일 업로드 및 이미지 처리
    // Firebase Storage는 app.storage.type=firebase 일 때만 사용 (기본값 local은 로컬 디스크 저장)
    implementation("com.google.firebase:firebase-admin:9.2.0")
    implementation 'net.coobird:thumbnailator:0.4.19'


    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

    // 롬복
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // 테스트 관련
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.security:spring-security-test'
    runtimeOnly 'com.mysql:mysql-connector-j'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // 테스트 전용 인메모리 DB (MySQL 호환 모드) - 외부 MySQL 없이 @SpringBootTest 실행
    testRuntimeOnly 'com.h2database:h2'
    testCompileOnly 'org.projectlombok:lombok'
    testAnnotationProcessor 'org.projectlombok:lombok'


    // 캐싱 기능 (Spring Cache)
    implementation 'org.springframework.boot:spring-boot-starter-cache'

    // Redis 연동 (세션, 캐싱, 실시간 처리)
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // 서버 모니터링 및 헬스 체크
    implementation 'org.springframework.boot:spring-boot-starter-actuator'

    // 외부 API 재시도 처리
    implementation 'org.springframework.retry:spring-retry'
    implementation 'org.springframework:spring-aspects'

    // DB 마이그레이션 관리
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'


}

def querydslDir = file("$buildDir/generated/sources/annotationProcessor/java/main")

sourceSets {
    main {
        java {
            srcDirs += querydslDir
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.generatedSourceOutputDirectory = querydslDir
}


tasks.named('test') {
    useJUnitPlatform()
}